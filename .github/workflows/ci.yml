name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (engine has no dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          hinger solve full4x4
          hinger path 1111/1111/1111 0110/1111/0110 --min-cost
          hinger play --board ring -a mcts -b alphabeta --think 0.1 --seed 1 --save games/ci.json
          hinger replay games/ci.json
